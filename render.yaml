# Render Blueprint: creates the whole demo in one go.
# Render dashboard → New → Blueprint → pick this repository.
#
# Free plan: services sleep after 15 minutes idle and take ~1 minute to wake.
# Open the site a minute before a demo, or switch both services to "starter".
#
# If Render gives a service a different URL than the ones below (it adds a suffix when a
# name is taken), update FRONTEND_URL / ALLOWED_HOSTS on hayahaze-api and
# API_INTERNAL_URL / NEXT_PUBLIC_SITE_URL on hayahaze-store, then redeploy both.

databases:
  - name: hayahaze-db
    plan: free
    region: singapore
    databaseName: hayahaze
    user: hayahaze

services:
  # Django API, admin portal (/admin) and CMS (/cms)
  - type: web
    name: hayahaze-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hayahaze-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@hayaandhaze.com
      # Generated by Render. Find it under hayahaze-api → Environment.
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      - key: FRONTEND_URL
        value: https://hayahaze-store.onrender.com
      # The storefront proxies API calls, so its hostname reaches Django too.
      - key: ALLOWED_HOSTS
        value: hayahaze-store.onrender.com
      # Demo only: test-mode payments while no Razorpay keys are set. Remove for launch.
      - key: DEMO_PAYMENTS
        value: "True"
      # Demo only: Django serves uploaded media. Use S3 for launch (see README).
      - key: SERVE_MEDIA
        value: "True"
      - key: WEB_CONCURRENCY
        value: "2"

  # Next.js storefront
  - type: web
    name: hayahaze-store
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_INTERNAL_URL
        value: https://hayahaze-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://hayahaze-store.onrender.com
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
