# One-command local stack:  docker compose up --build
# Then seed the demo store: docker compose exec backend python manage.py seed_demo
#
# Storefront http://localhost:3000   Admin http://localhost:8000/admin   CMS http://localhost:8000/cms

x-backend: &backend
  build: ./backend
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    DEBUG: "True"
    DATABASE_URL: postgres://hayahaze:hayahaze@postgres:5432/hayahaze
    REDIS_URL: redis://redis:6379/0
    FRONTEND_URL: http://localhost:3000
    BACKEND_URL: http://localhost:8000
    ALLOWED_HOSTS: localhost,127.0.0.1,backend
  volumes:
    - media:/app/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hayahaze
      POSTGRES_USER: hayahaze
      POSTGRES_PASSWORD: hayahaze
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hayahaze"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  backend:
    <<: *backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  celery:
    <<: *backend
    command: celery -A config worker -l info --concurrency 2

  celery-beat:
    <<: *backend
    command: celery -A config beat -l info

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://backend:8000
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  media:
