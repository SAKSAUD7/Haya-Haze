              $ref: '#/components/schemas/CodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CodeRequest'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - {}
      responses:
        '200':
