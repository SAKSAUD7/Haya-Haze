components:
  schemas:
    AddItemRequest:
      type: object
      properties:
        variant_id:
          type: integer
        quantity:
          type: integer
          maximum: 10
          minimum: 1
          default: 1
      required:
      - variant_id
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 20
        line1:
          type: string
          title: Address line 1
          maxLength: 200
        line2:
          type: string
          title: Address line 2
          maxLength: 200
        landmark:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 80
        state:
          type: string
          maxLength: 80
        pincode:
          type: string
          maxLength: 10
        country:
          type: string
          maxLength: 2
        is_default:
          type: boolean
      required:
      - city
      - full_name
      - id
      - line1
      - phone
      - pincode
      - state
    AddressRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 1
          maxLength: 20
        line1:
          type: string
          minLength: 1
          title: Address line 1
          maxLength: 200
        line2:
          type: string
          title: Address line 2
          maxLength: 200
        landmark:
          type: string
          maxLength: 120
        city:
          type: string
          minLength: 1
          maxLength: 80
        state:
          type: string
          minLength: 1
          maxLength: 80
        pincode:
          type: string
          minLength: 1
          maxLength: 10
        country:
          type: string
          minLength: 1
          maxLength: 2
        is_default:
          type: boolean
      required:
      - city
      - full_name
      - line1
      - phone
      - pincode
      - state
    Announcement:
      type: object
      properties:
        text:
          type: string
          maxLength: 140
        link:
          type: string
          maxLength: 200
      required:
      - text
    BackInStockRequest:
      type: object
      properties:
        variant_id:
          type: integer
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
      - variant_id
    BlankEnum:
      enum:
      - ''
    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        saved:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        upsell:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
        item_count:
          type: integer
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        coupon_code:
          type: string
        coupon_message:
          type: string
        shipping_method:
          type: string
        shipping:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        shipping_free:
          type: boolean
        free_shipping_threshold:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        free_shipping_remaining:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        cod_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        cod_available:
          type: boolean
        cod_unavailable_reason:
          type: string
        gift_wrap:
          type: boolean
        gift_wrap_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        gift_wrap_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        gift_note:
          type: string
        order_note:
          type: string
        tax_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        tax_included:
          type: boolean
        gift_card_code:
          type: string
        gift_card_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        issues:
          type: array
          items:
            type: string
      required:
      - cod_available
      - cod_fee
      - cod_unavailable_reason
      - coupon_code
      - coupon_message
      - discount
      - free_shipping_remaining
      - free_shipping_threshold
      - gift_card_amount
      - gift_card_code
      - gift_note
      - gift_wrap
      - gift_wrap_fee
      - gift_wrap_price
      - issues
      - item_count
      - items
      - order_note
      - saved
      - shipping
      - shipping_free
      - shipping_method
      - subtotal
      - tax_included
      - tax_total
      - total
      - upsell
    CartLine:
      type: object
      properties:
        id:
          type: integer
        variant_id:
          type: integer
        product_id:
          type: integer
        slug:
          type: string
        name:
          type: string
        variant_label:
          type: string
        color_hex:
          type: string
        image:
          type: string
