      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceOrderResponse'
          description: ''
  /api/v1/collections/:
