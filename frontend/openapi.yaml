              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_coupon_destroy
      tags:
      - cart
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/cart/gift-card/:
