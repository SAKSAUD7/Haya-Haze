          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BackInStockRequest'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/v1/cart/:
    get:
      operationId: cart_retrieve
      description: The current bag with server-calculated totals.
      parameters:
      - in: query
        name: payment_method
        schema:
          type: string
        description: razorpay, cod or stripe
      - in: query
        name: shipping_method
        schema:
          type: string
        description: standard or express
      tags:
      - cart
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    patch:
      operationId: cart_partial_update
      tags:
      - cart
      requestBody:
